<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skool.LOL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}


:root{
--blue:#2563eb;
}


body{

height:100vh;
overflow:hidden;

background:#000;

color:white;

}


/* ==================
LOADER
================== */


.loader{

position:fixed;
inset:0;

background:#000;

display:flex;
align-items:center;
justify-content:center;

z-index:9999;

transition:opacity .8s ease;

}


.loader-box{

text-align:center;

}


.loader-logo{

font-size:70px;

font-weight:900;

letter-spacing:-6px;

animation:pulse 1.5s infinite;

}


.loader-logo span{

color:var(--blue);

}


.loader-ring{

width:120px;
height:120px;

border-radius:50%;

border:3px solid rgba(255,255,255,.1);

border-top-color:var(--blue);

margin:35px auto;

animation:spin 1s linear infinite;

}


.loader-text{

font-size:14px;

color:#666;

letter-spacing:3px;

}



.boot{

margin-top:20px;

font-size:13px;

color:#444;

line-height:25px;

}


.boot div{

opacity:0;

animation:boot .5s forwards;

}


.boot div:nth-child(1){
animation-delay:.5s;
}


.boot div:nth-child(2){
animation-delay:1s;
}


.boot div:nth-child(3){
animation-delay:1.5s;
}



@keyframes boot{

to{
opacity:1;
color:#777;
}

}



@keyframes pulse{

50%{
transform:scale(1.06);
}

}


@keyframes spin{

100%{
transform:rotate(360deg);
}

}





/* ==================
BACKGROUND
================== */


#particles{

position:fixed;

inset:0;

z-index:0;

}



.glow{

position:absolute;

width:600px;

height:600px;

border-radius:50%;

background:#2563eb;

filter:blur(200px);

opacity:.12;

}


.glow.one{

top:-250px;

left:-250px;

}


.glow.two{

bottom:-250px;

right:-250px;

}



.grid{

position:absolute;

inset:0;

background-image:

linear-gradient(
rgba(255,255,255,.025) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(255,255,255,.025) 1px,
transparent 1px
);


background-size:60px 60px;

mask-image:linear-gradient(
transparent,
black,
transparent
);

}



/* ==================
MAIN
================== */


.app{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

position:relative;

z-index:2;

perspective:1200px;

}



.card{


width:850px;

max-width:92%;


padding:65px;


background:

linear-gradient(
145deg,
rgba(255,255,255,.09),
rgba(255,255,255,.03)
);


border:

1px solid rgba(255,255,255,.12);


border-radius:40px;


backdrop-filter:blur(30px);


box-shadow:

0 50px 120px rgba(0,0,0,.9);


transition:.15s;


animation:show 1s ease;


overflow:hidden;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

}

}
   /* ==================
CARD CONTENT
================== */


.card::before{

content:"";

position:absolute;

inset:-2px;


background:

linear-gradient(
120deg,
transparent,
#2563eb,
transparent
);


opacity:.25;


animation:borderMove 8s linear infinite;

}



@keyframes borderMove{

from{
transform:translateX(-70%);
}

to{
transform:translateX(70%);
}

}



.card > *{

position:relative;

z-index:2;

}



/* LOGO */


.logo{

font-size:85px;

font-weight:900;

letter-spacing:-7px;

}


.logo span{

color:var(--blue);

text-shadow:

0 0 35px var(--blue);

}



.subtitle{

margin-top:15px;

font-size:20px;

color:#888;

}




.divider{

height:1px;

margin:40px 0;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.2),
transparent
);

}




/* FORM */


form{

display:flex;

gap:15px;

}



.input-box{


height:70px;

flex:1;

display:flex;

align-items:center;


background:#050505;


border:

1px solid rgba(255,255,255,.12);



border-radius:22px;


}



.input-box:focus-within{

border-color:var(--blue);

box-shadow:

0 0 30px rgba(37,99,235,.25);

}



.input-icon{

font-size:22px;

margin-left:20px;

}



input{


width:100%;


height:100%;


padding:0 20px;


background:none;


border:none;


outline:none;


color:white;


font-size:16px;

}




button{


height:70px;


padding:0 40px;


border-radius:22px;


border:none;


background:white;


color:black;


font-size:16px;


font-weight:800;


cursor:pointer;


transition:.3s;


}



button:hover{

background:var(--blue);

color:white;

transform:translateY(-5px);


box-shadow:

0 20px 50px rgba(37,99,235,.4);

}





.status{

display:flex;

justify-content:center;

gap:15px;

margin-top:35px;

flex-wrap:wrap;

}



.status div{


padding:10px 20px;


border-radius:999px;


background:rgba(255,255,255,.05);


border:1px solid rgba(255,255,255,.1);


color:#888;


font-size:14px;

}




.footer{

text-align:center;

margin-top:35px;

color:#555;

font-size:13px;

}





@media(max-width:700px){

.card{

padding:35px 25px;

}


.logo{

font-size:50px;

}


form{

flex-direction:column;

}


button{

width:100%;

}

}

</style>

</head>



<body>


<div class="loader" id="loader">

<div class="loader-box">

<div class="loader-logo">

Skool<span>.LOL</span>

</div>


<div class="loader-ring"></div>


<div class="loader-text">

STARTING SYSTEM

</div>


<div class="boot">

<div>✓ Loading Core</div>

<div>✓ Secure Connection</div>

<div>✓ Proxy Ready</div>

</div>


</div>

</div>




<canvas id="particles"></canvas>


<div class="glow one"></div>

<div class="glow two"></div>


<div class="grid"></div>



<div class="app">


<div class="card" id="card">


<div class="logo">

Skool<span>.LOL</span>

</div>


<div class="subtitle">

Fast. Private. Modern Web Proxy.

</div>



<div class="divider"></div>




<form id="proxy">


<div class="input-box">


<div class="input-icon">

🌐

</div>


<input

id="url"

placeholder="https://example.com"

autocomplete="off"

>


</div>



<button>

Launch 🚀

</button>



</form>




<div class="status">


<div>🟢 Online</div>

<div>⚡ Fast</div>

<div>🔒 Secure</div>


</div>




<div class="footer">

Powered by Node.js • Skool.LOL

</div>



</div>

</div>




<script>


/* Loader */


window.onload=()=>{


setTimeout(()=>{


document
.getElementById("loader")
.style.opacity="0";



setTimeout(()=>{


document
.getElementById("loader")
.remove();



},800);



},2600);



};





/* 3D Card */


const card=document.getElementById("card");



document.addEventListener("mousemove",e=>{


let x=(e.clientX/innerWidth-.5)*12;

let y=(e.clientY/innerHeight-.5)*12;



card.style.transform=

`
rotateY(${x}deg)
rotateX(${-y}deg)
`;

});







/* Particles */


const canvas=document.getElementById("particles");

const ctx=canvas.getContext("2d");


function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}


resize();

window.onresize=resize;



let dots=[];



for(let i=0;i<120;i++){

dots.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

s:Math.random()*2+1,

v:Math.random()*.5+.1

});

}




function draw(){


ctx.clearRect(0,0,canvas.width,canvas.height);



dots.forEach(d=>{


d.y-=d.v;


if(d.y<0){

d.y=canvas.height;

}



ctx.beginPath();


ctx.arc(
d.x,
d.y,
d.s,
0,
Math.PI*2
);



ctx.fillStyle="rgba(255,255,255,.25)";


ctx.fill();



});



requestAnimationFrame(draw);


}


draw();





/* Proxy */


document
.getElementById("proxy")
.addEventListener("submit",e=>{


e.preventDefault();



let url=document
.getElementById("url")
.value
.trim();



if(!url)return;



if(!url.startsWith("http"))

url="https://"+url;



window.location=

location.protocol+

"//"+

location.host+

"/proxy/"+
url;



});


</script>


</body>

</html>
