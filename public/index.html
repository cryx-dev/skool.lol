<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skool.LOL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


:root{

--blue:#2563eb;
--dark:#000;

}



body{

height:100vh;

overflow:hidden;

background:#000;

color:white;

}



/* ==========================
   LOADER
========================== */


.loader{

position:fixed;

inset:0;

background:#000;

display:flex;

justify-content:center;

align-items:center;

z-index:999;


}



.loader-content{

text-align:center;

}



.loader-logo{


font-size:70px;

font-weight:900;

letter-spacing:-6px;


animation:logoPulse 2s infinite;


}



.loader-logo span{

color:var(--blue);

}



@keyframes logoPulse{


0%,100%{

transform:scale(1);

text-shadow:0 0 20px transparent;

}


50%{

transform:scale(1.05);

text-shadow:0 0 60px var(--blue);

}


}



.loader-ring{


width:140px;

height:140px;

margin:40px auto;


border-radius:50%;


border:

2px solid rgba(255,255,255,.1);



border-top-color:var(--blue);



animation:

spin 1s linear infinite;



}



@keyframes spin{

to{

transform:rotate(360deg);

}

}



.loader-text{


color:#777;

font-size:14px;

letter-spacing:2px;


}



.loading-lines{


margin-top:20px;

font-size:13px;

color:#555;


}



.loading-lines div{


opacity:0;

animation:

showLine .4s forwards;


}



.loading-lines div:nth-child(1){

animation-delay:.5s;

}


.loading-lines div:nth-child(2){

animation-delay:1s;

}


.loading-lines div:nth-child(3){

animation-delay:1.5s;

}



@keyframes showLine{

to{

opacity:1;

}

}





/* ==========================
BACKGROUND
========================== */


#particles{

position:fixed;

inset:0;

}



.background-glow{


position:absolute;


width:700px;

height:700px;


border-radius:50%;


background:var(--blue);


filter:blur(220px);


opacity:.12;


}



.glow-left{

top:-300px;

left:-300px;

}



.glow-right{

bottom:-300px;

right:-300px;

}



.grid{


position:absolute;

inset:0;


background-image:

linear-gradient(
rgba(255,255,255,.025) 1px,
transparent 1px
),


linear-gradient(
90deg,
rgba(255,255,255,.025) 1px,
transparent 1px
);



background-size:60px 60px;


mask-image:

linear-gradient(
transparent,
black,
transparent
);


}
   /* ==========================
   MAIN APP
========================== */


.app{

position:relative;

z-index:5;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

perspective:1200px;

}



.card{


width:850px;

max-width:92%;


padding:70px;


background:

linear-gradient(
145deg,
rgba(255,255,255,.09),
rgba(255,255,255,.025)
);


border-radius:40px;


border:

1px solid rgba(255,255,255,.12);



backdrop-filter:blur(35px);


box-shadow:


0 50px 150px rgba(0,0,0,.9),


0 0 100px rgba(37,99,235,.12);



transform-style:preserve-3d;


transition:.15s ease;



overflow:hidden;


animation:

cardShow 1s ease;


}



@keyframes cardShow{

from{

opacity:0;

transform:

translateY(40px)
scale(.95);

}

to{

opacity:1;

transform:none;

}

}




/* Animated border */


.card::before{


content:"";


position:absolute;


inset:-2px;



background:

linear-gradient(
120deg,
transparent,
#2563eb,
transparent
);



opacity:.25;


animation:

borderFlow 6s linear infinite;



}



@keyframes borderFlow{


from{

transform:translateX(-60%);

}


to{

transform:translateX(60%);

}


}



.card > *{

position:relative;

z-index:2;

}




/* LOGO */


.logo{


font-size:90px;


font-weight:900;


letter-spacing:-8px;



}



.logo span{


color:#2563eb;


text-shadow:


0 0 35px #2563eb;


}




.subtitle{


margin-top:20px;


font-size:21px;


color:#888;


}



/* Divider */


.divider{


height:1px;


margin:45px 0;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.2),
transparent
);


}



/* INPUT */


form{


display:flex;

gap:15px;


}



.input-container{


height:75px;

flex:1;


display:flex;

align-items:center;



background:#050505;



border:

1px solid rgba(255,255,255,.12);



border-radius:24px;



transition:.35s;


}



.input-container:focus-within{


border-color:#2563eb;


box-shadow:


0 0 35px rgba(37,99,235,.25);


}



.input-icon{


font-size:24px;

margin-left:25px;


}



input{


height:100%;


width:100%;


padding:0 20px;



background:none;


border:none;


outline:none;


color:white;


font-size:17px;


}



input::placeholder{

color:#555;

}





/* BUTTON */


button{


height:75px;


padding:0 45px;


border-radius:24px;


border:none;



background:white;


color:#000;


font-size:17px;


font-weight:800;



cursor:pointer;


transition:.35s;


position:relative;


overflow:hidden;


}



button:hover{


background:#2563eb;


color:white;


transform:translateY(-5px);



box-shadow:


0 20px 60px rgba(37,99,235,.5);


}



button::before{


content:"";


position:absolute;


width:100%;


height:100%;


left:-120%;


top:0;


background:


linear-gradient(
120deg,
transparent,
rgba(255,255,255,.8),
transparent
);



transition:.6s;


}



button:hover::before{


left:120%;


}





/* STATUS */


.status{


display:flex;


justify-content:center;


gap:15px;


margin-top:45px;


flex-wrap:wrap;


}



.status-box{


padding:12px 22px;


border-radius:50px;


background:

rgba(255,255,255,.05);



border:

1px solid rgba(255,255,255,.1);



color:#aaa;


font-size:14px;


animation:

statusPulse 3s infinite;


}



@keyframes statusPulse{


50%{

border-color:rgba(37,99,235,.5);

}


}




.footer{


margin-top:40px;


color:#555;


font-size:14px;


text-align:center;


}




@media(max-width:700px){


.card{

padding:40px 25px;

}


.logo{

font-size:55px;

letter-spacing:-4px;

}



form{

flex-direction:column;

}



button{

width:100%;

}


}
   <script>


/* ==========================
   LOADER SYSTEM
========================== */


window.addEventListener("load",()=>{


setTimeout(()=>{


document.querySelector(".loader").style.opacity="0";


setTimeout(()=>{

document.querySelector(".loader").remove();

},800);



},2500);



});





/* ==========================
   MOUSE LIGHT
========================== */


const mouseGlow=document.createElement("div");


mouseGlow.style.position="fixed";

mouseGlow.style.width="300px";

mouseGlow.style.height="300px";

mouseGlow.style.borderRadius="50%";

mouseGlow.style.pointerEvents="none";

mouseGlow.style.background="#2563eb";

mouseGlow.style.opacity=".08";

mouseGlow.style.filter="blur(100px)";

mouseGlow.style.zIndex="1";



document.body.appendChild(mouseGlow);



document.addEventListener("mousemove",(e)=>{


mouseGlow.style.left=

e.clientX-150+"px";


mouseGlow.style.top=

e.clientY-150+"px";


});





/* ==========================
   3D CARD EFFECT
========================== */


const card=document.querySelector(".card");



document.addEventListener("mousemove",(e)=>{


let x=

(e.clientX/window.innerWidth-.5)*15;


let y=

(e.clientY/window.innerHeight-.5)*15;



card.style.transform=

`

rotateX(${-y}deg)

rotateY(${x}deg)

`;



});



document.addEventListener("mouseleave",()=>{


card.style.transform="";


});







/* ==========================
   CANVAS PARTICLES
========================== */


const canvas=document.getElementById("particles");

const ctx=canvas.getContext("2d");



let particles=[];



function resize(){


canvas.width=window.innerWidth;

canvas.height=window.innerHeight;


}



resize();


window.addEventListener(
"resize",
resize
);




class Particle{


constructor(){


this.x=Math.random()*canvas.width;

this.y=Math.random()*canvas.height;


this.size=Math.random()*2+0.5;


this.speed=Math.random()*0.5+0.1;



}


update(){


this.y-=this.speed;



if(this.y<0){


this.y=canvas.height;


this.x=Math.random()*canvas.width;


}


}



draw(){


ctx.beginPath();


ctx.arc(
this.x,
this.y,
this.size,
0,
Math.PI*2
);


ctx.fillStyle=
"rgba(255,255,255,.25)";


ctx.fill();



}


}



for(let i=0;i<150;i++){

particles.push(
new Particle()
);

}





function particleLoop(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



particles.forEach(p=>{


p.update();

p.draw();



});



requestAnimationFrame(
particleLoop
);


}


particleLoop();







/* ==========================
   PROXY LAUNCH
========================== */


const form=document
.getElementById(
"unblocker-form"
);



form.addEventListener(
"submit",
(e)=>{


e.preventDefault();



let url=document
.getElementById("url")
.value
.trim();



if(!url)
return;




if(!url.startsWith("http"))

url="https://"+url;





const button=
form.querySelector("button");



button.innerHTML=
"Connecting... ⚡";



button.disabled=true;




setTimeout(()=>{


button.innerHTML=
"Launching 🚀";



},900);





setTimeout(()=>{


window.location=

location.protocol+

"//"+

location.host+

"/proxy/"+
url;



},1600);



}

);





</script>


</body>

</html>
