<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skool.LOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}


:root{
    --blue:#2563eb;
    --dark:#000;
    --panel:#080808;
}



body{

    background:#000;
    color:white;
    height:100vh;
    overflow:hidden;

}



/* =====================
   BOOT SCREEN
===================== */


.boot-screen{

position:fixed;
inset:0;

background:#000;

display:flex;
align-items:center;
justify-content:center;

z-index:9999;

transition:1s;

}



.boot-container{

text-align:center;

}



.boot-logo{

font-size:80px;

font-weight:900;

letter-spacing:-8px;

animation:
logoIn 1.5s ease;


}



.boot-logo span{

color:var(--blue);

}



@keyframes logoIn{

from{

opacity:0;

transform:
scale(.8)
translateY(30px);

}

to{

opacity:1;

}

}




.core-ring{

width:150px;
height:150px;

margin:40px auto;


border-radius:50%;


border:

2px solid rgba(255,255,255,.08);



border-top-color:

var(--blue);



animation:

rotate 1s linear infinite;


}



@keyframes rotate{

100%{

transform:rotate(360deg);

}

}




.system-text{

color:#777;

font-size:13px;

letter-spacing:3px;

}



.progress{

width:280px;

height:4px;

background:#111;

margin:25px auto;

overflow:hidden;

border-radius:10px;


}



.progress span{

display:block;

height:100%;

width:0;


background:

linear-gradient(
90deg,
#2563eb,
#60a5fa
);


animation:

load 2.5s forwards;


}



@keyframes load{

to{

width:100%;

}

}





.logs{

margin-top:20px;

font-size:13px;

color:#444;

line-height:25px;

}



.logs div{

opacity:0;

animation:

appear .4s forwards;

}


.logs div:nth-child(1){

animation-delay:.5s;

}


.logs div:nth-child(2){

animation-delay:1s;

}


.logs div:nth-child(3){

animation-delay:1.5s;

}


.logs div:nth-child(4){

animation-delay:2s;

}



@keyframes appear{

to{

opacity:1;

color:#888;

}

}





/* =====================
BACKGROUND
===================== */


#canvas{

position:fixed;

inset:0;

z-index:0;

}



.light{

position:absolute;

width:700px;
height:700px;

border-radius:50%;

background:#2563eb;

filter:blur(220px);

opacity:.12;


}



.light.one{

top:-300px;

left:-300px;

}



.light.two{

bottom:-300px;

right:-300px;

}





.grid{

position:absolute;

inset:0;


background-image:


linear-gradient(
rgba(255,255,255,.025) 1px,
transparent 1px
),


linear-gradient(
90deg,
rgba(255,255,255,.025) 1px,
transparent 1px
);



background-size:55px 55px;


mask-image:
linear-gradient(
transparent,
black,
transparent
);


}
   /* =====================
   MAIN APP
===================== */


.app{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

position:relative;

z-index:5;

perspective:1400px;

}



.dashboard{

width:900px;

max-width:94%;


padding:60px;



background:

linear-gradient(
145deg,
rgba(255,255,255,.09),
rgba(255,255,255,.025)
);



border:

1px solid rgba(255,255,255,.12);



border-radius:38px;



backdrop-filter:

blur(35px);



box-shadow:


0 50px 150px rgba(0,0,0,.9),


0 0 100px rgba(37,99,235,.12);



position:relative;


overflow:hidden;


transition:.15s;


animation:

dashboardIn 1s ease;


}




.dashboard::before{


content:"";


position:absolute;

inset:0;



background:

radial-gradient(
circle at var(--x,50%) var(--y,50%),
rgba(255,255,255,.12),
transparent 35%
);



pointer-events:none;


}




@keyframes dashboardIn{


from{

opacity:0;

transform:

translateY(50px)
scale(.95);


}

to{

opacity:1;


}

}





/* =====================
HEADER
===================== */


.brand{


display:flex;

align-items:center;

justify-content:space-between;


}



.logo{


font-size:80px;

font-weight:900;


letter-spacing:-7px;


}



.logo span{


color:#2563eb;


text-shadow:


0 0 40px #2563eb;


}



.version{


padding:10px 18px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.1);


border-radius:999px;


font-size:13px;


color:#aaa;


}





.subtitle{


margin-top:15px;


font-size:20px;


color:#888;


}



/* =====================
STATUS CARDS
===================== */


.status-grid{


display:grid;

grid-template-columns:

repeat(3,1fr);


gap:15px;


margin-top:35px;


}



.status-card{


padding:20px;


background:#050505;


border:

1px solid rgba(255,255,255,.08);


border-radius:20px;


transition:.3s;


}



.status-card:hover{


transform:

translateY(-5px);


border-color:#2563eb;


}



.status-title{


font-size:12px;

color:#666;


text-transform:uppercase;

letter-spacing:2px;


}



.status-value{


margin-top:10px;


font-size:20px;

font-weight:700;


}





/* =====================
DIVIDER
===================== */


.divider{


height:1px;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.2),
transparent
);



margin:40px 0;


}





/* =====================
URL ENGINE
===================== */


.proxy-box{


display:flex;

gap:15px;


}



.url-container{


height:75px;

flex:1;


display:flex;

align-items:center;


background:#050505;



border:

1px solid rgba(255,255,255,.12);



border-radius:24px;


transition:.3s;


}



.url-container:focus-within{


border-color:#2563eb;


box-shadow:

0 0 40px rgba(37,99,235,.25);


}



.url-icon{


font-size:24px;

padding-left:25px;


}



input{


width:100%;

height:100%;


background:none;


border:none;


outline:none;


color:white;


font-size:17px;


padding:0 20px;


}



input::placeholder{

color:#555;

}





/* =====================
LAUNCH BUTTON
===================== */


.launch{


height:75px;


padding:0 45px;


border:none;


border-radius:24px;


background:white;


color:black;


font-weight:800;


font-size:17px;


cursor:pointer;


transition:.35s;


position:relative;


overflow:hidden;


}



.launch:hover{


background:#2563eb;


color:white;


transform:

translateY(-5px);


box-shadow:

0 20px 60px rgba(37,99,235,.5);


}



.launch.loading{


pointer-events:none;


background:#2563eb;


color:white;


}



.launch::after{


content:"";


position:absolute;


inset:0;


background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.8),
transparent
);


transform:

translateX(-120%);


}



.launch:hover::after{


transform:

translateX(120%);


transition:.6s;


}





/* =====================
FOOTER
===================== */


.footer{


margin-top:35px;


display:flex;

justify-content:space-between;


color:#555;


font-size:13px;


}





@media(max-width:700px){


.dashboard{

padding:35px 25px;

}


.logo{

font-size:50px;

}


.status-grid{

grid-template-columns:1fr;

}


.proxy-box{

flex-direction:column;

}


.launch{

width:100%;

}


.footer{

flex-direction:column;

gap:10px;

text-align:center;

}


}
   </style>

</head>

<body>


<!-- BOOT SCREEN -->

<div class="boot-screen" id="boot">

<div class="boot-container">


<div class="boot-logo">

Skool<span>.LOL</span>

</div>


<div class="core-ring"></div>


<div class="system-text">

SYSTEM INITIALIZATION

</div>


<div class="progress">

<span></span>

</div>


<div class="logs">

<div>✓ Loading Proxy Engine</div>

<div>✓ Checking Security Layer</div>

<div>✓ Connecting Network</div>

<div>✓ Skool.LOL Online</div>

</div>


</div>

</div>



<canvas id="canvas"></canvas>


<div class="light one"></div>

<div class="light two"></div>


<div class="grid"></div>




<!-- MAIN -->

<div class="app">


<div class="dashboard" id="card">



<div class="brand">


<div class="logo">

Skool<span>.LOL</span>

</div>


<div class="version">

v2.0 PRO

</div>


</div>




<div class="subtitle">

The next generation web proxy.

Fast. Private. Secure.

</div>




<div class="status-grid">


<div class="status-card">

<div class="status-title">

Server

</div>

<div class="status-value">

🟢 Online

</div>

</div>



<div class="status-card">

<div class="status-title">

Latency

</div>

<div class="status-value">

⚡ 12ms

</div>

</div>



<div class="status-card">

<div class="status-title">

Security

</div>

<div class="status-value">

🔒 Active

</div>

</div>



</div>





<div class="divider"></div>





<form id="proxy">



<div class="proxy-box">


<div class="url-container">


<div class="url-icon">

🌐

</div>


<input

id="url"

placeholder="Enter website URL..."

autocomplete="off"

>


</div>



<button class="launch">

Launch 🚀

</button>



</div>



</form>





<div class="footer">


<div>

Powered by Node.js

</div>


<div>

© Skool.LOL

</div>


</div>



</div>

</div>





<script>



/* =====================
BOOT EXIT
===================== */


setTimeout(()=>{


const boot=document.getElementById("boot");


boot.style.opacity="0";


setTimeout(()=>{


boot.remove();


},1000);



},3500);







/* =====================
MOUSE LIGHT + CARD
===================== */


const card=document.getElementById("card");



document.addEventListener(
"mousemove",
(e)=>{


let x=e.clientX;

let y=e.clientY;



card.style.setProperty(
"--x",
x+"px"
);


card.style.setProperty(
"--y",
y+"px"
);




let rotateY=

(x/window.innerWidth-.5)*14;


let rotateX=

-(y/window.innerHeight-.5)*14;



card.style.transform=

`
rotateX(${rotateX}deg)
rotateY(${rotateY}deg)
`;



}

);





document.addEventListener(
"mouseleave",
()=>{

card.style.transform="";

}

);








/* =====================
PARTICLE ENGINE
===================== */


const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");



function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}


resize();

window.addEventListener(
"resize",
resize
);



let particles=[];



for(let i=0;i<160;i++){


particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*2,

speed:Math.random()*0.5+.1

});


}





function animate(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



particles.forEach(p=>{


p.y-=p.speed;



if(p.y<0){

p.y=canvas.height;

p.x=Math.random()*canvas.width;

}



ctx.beginPath();


ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);



ctx.fillStyle=

"rgba(255,255,255,.3)";



ctx.fill();



});



requestAnimationFrame(
animate
);


}


animate();









/* =====================
PROXY SYSTEM
===================== */


const form=document.getElementById("proxy");


const button=document.querySelector(".launch");




form.addEventListener(
"submit",
(e)=>{


e.preventDefault();



let url=document
.getElementById("url")
.value
.trim();



if(!url)return;



if(!url.startsWith("http"))

url="https://"+url;





button.classList.add(
"loading"
);



button.innerHTML=

"Connecting ⚡";




setTimeout(()=>{

button.innerHTML=

"Starting Proxy...";

},700);




setTimeout(()=>{

button.innerHTML=

"Launching 🚀";


},1400);




setTimeout(()=>{


window.location=

location.protocol+

"//"+

location.host+

"/proxy/"+
url;



},2200);



}

);



</script>


</body>

</html>
