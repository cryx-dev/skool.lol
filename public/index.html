<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skool.LOL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


:root{

    --bg:#000;
    --panel:#050505;
    --border:#1c1c1c;
    --text:#fff;
    --muted:#777;
    --blue:#2563eb;

}


body{

    min-height:100vh;

    background:#000;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-family:Inter,sans-serif;

}


/* Background Grid */

.grid{

    position:fixed;

    inset:0;

    background-image:

    linear-gradient(
    rgba(255,255,255,.025) 1px,
    transparent 1px
    ),

    linear-gradient(
    90deg,
    rgba(255,255,255,.025) 1px,
    transparent 1px
    );

    background-size:40px 40px;

    mask-image:linear-gradient(
    black,
    transparent
    );

}



/* Scanline */

.scanline{

position:fixed;

left:0;

right:0;

height:150px;

background:

linear-gradient(
transparent,
rgba(37,99,235,.04),
transparent
);

animation:scan 8s linear infinite;

}



@keyframes scan{

from{

transform:translateY(-200px);

}

to{

transform:translateY(100vh);

}

}





/* Loader */


.loader{

position:fixed;

inset:0;

background:#000;

display:flex;

align-items:center;

justify-content:center;

z-index:20;

transition:1s;


}



.loader-box{

width:420px;

max-width:90%;

font-family:"JetBrains Mono",monospace;

}



.loader-logo{

font-family:Inter;

font-size:55px;

font-weight:800;

letter-spacing:-3px;

margin-bottom:40px;


}



.loader-logo span{

color:var(--blue);

}



.console{


color:#777;

font-size:14px;

line-height:30px;


}



.console span{

color:#fff;

}



.progress{

margin-top:25px;

height:3px;

background:#111;

overflow:hidden;


}



.progress div{

height:100%;

width:0;

background:var(--blue);

animation:

progress 3s forwards;


}



@keyframes progress{

to{

width:100%;

}

}




/* Main */

.container{


width:900px;

max-width:92%;


position:relative;


}



.panel{


background:#030303;


border:1px solid var(--border);


padding:55px;


border-radius:20px;


box-shadow:

0 40px 100px rgba(0,0,0,.9);


}



.brand{


display:flex;

justify-content:space-between;

align-items:center;


}



.logo{


font-size:65px;

font-weight:800;

letter-spacing:-5px;


}



.logo span{

color:var(--blue);

}



.tag{

font-family:"JetBrains Mono";

font-size:12px;

color:#555;

border:1px solid #222;

padding:8px 12px;

border-radius:20px;

}


.subtitle{

margin-top:12px;

color:#666;

font-size:18px;

}



.divider{

height:1px;

background:#161616;

margin:35px 0;

}
    .input-area{

display:flex;

gap:12px;

}



.input-box{

height:65px;

flex:1;


display:flex;

align-items:center;


background:#000;


border:1px solid #222;


border-radius:14px;


transition:.3s;


}



.input-box:focus-within{

border-color:#2563eb;


box-shadow:

0 0 25px rgba(37,99,235,.15);


}



.prompt{

font-family:"JetBrains Mono";

color:#2563eb;

padding-left:20px;

font-size:18px;

}



input{

width:100%;

height:100%;


background:none;

border:none;

outline:none;


color:white;


font-family:"JetBrains Mono";

font-size:15px;


padding:0 15px;


}



input::placeholder{

color:#444;

}




button{


height:65px;

padding:0 35px;


background:#2563eb;


border:none;


border-radius:14px;


color:white;


font-weight:700;


cursor:pointer;


font-size:15px;


transition:.25s;


font-family:"JetBrains Mono";


}



button:hover{


background:#3b82f6;


transform:translateY(-2px);


box-shadow:

0 10px 30px rgba(37,99,235,.3);


}




.status{


display:grid;


grid-template-columns:

repeat(3,1fr);


gap:12px;


margin-top:30px;


}



.status-card{


background:#050505;


border:1px solid #181818;


padding:18px;


border-radius:14px;


}



.status-title{


font-size:11px;


color:#555;


font-family:"JetBrains Mono";


text-transform:uppercase;


}



.status-value{


margin-top:8px;


font-weight:600;


}





.footer{


margin-top:35px;


display:flex;


justify-content:space-between;


color:#444;


font-family:"JetBrains Mono";


font-size:12px;


}





/* Mobile */


@media(max-width:700px){


body{

padding:15px;

}



.panel{

padding:30px 20px;

}



.brand{

flex-direction:column;

align-items:flex-start;

gap:15px;


}



.logo{

font-size:45px;

letter-spacing:-3px;


}



.subtitle{

font-size:15px;

}



.input-area{


flex-direction:column;


}



button{


width:100%;


}



.status{


grid-template-columns:1fr;


}



.footer{


flex-direction:column;

gap:10px;


}



}




</style>

</head>



<body>


<div class="loader" id="loader">


<div class="loader-box">


<div class="loader-logo">

Skool<span>.LOL</span>

</div>


<div class="console">


<div>> Initializing proxy core...</div>

<div>> Checking network...</div>

<div>> Security layer active...</div>

<div>> <span>System ready.</span></div>


</div>


<div class="progress">

<div></div>

</div>


</div>


</div>



<div class="grid"></div>

<div class="scanline"></div>




<div class="container">


<div class="panel">



<div class="brand">


<div class="logo">

Skool<span>.LOL</span>

</div>


<div class="tag">

PROXY ENGINE

</div>


</div>



<div class="subtitle">

Fast. Private. Built for the modern web.

</div>



<div class="divider"></div>




<form id="proxy">


<div class="input-area">


<div class="input-box">


<div class="prompt">

>

</div>


<input

id="url"

placeholder="enter website..."

autocomplete="off"


>


</div>



<button>

START

</button>


</div>


</form>





<div class="status">


<div class="status-card">

<div class="status-title">

System

</div>


<div class="status-value">

🟢 Online

</div>

</div>



<div class="status-card">

<div class="status-title">

Network

</div>


<div class="status-value">

⚡ Fast

</div>

</div>



<div class="status-card">

<div class="status-title">

Security

</div>


<div class="status-value">

🔒 Active

</div>

</div>


</div>





<div class="footer">


<div>

NODE.JS ENGINE

</div>


<div>

SKOOL.LOL

</div>


</div>



</div>


</div>






<script>


// Loader


setTimeout(()=>{


document
.getElementById("loader")
.style.opacity="0";


setTimeout(()=>{


document
.getElementById("loader")
.remove();



},1000);



},3200);





// Proxy


document
.getElementById("proxy")
.addEventListener("submit",e=>{


e.preventDefault();


let url=document
.getElementById("url")
.value
.trim();



if(!url)return;



if(!url.startsWith("http"))

url="https://"+url;




const btn=document.querySelector("button");


btn.innerHTML="LOADING...";



setTimeout(()=>{


window.location=

location.protocol+

"//"+

location.host+

"/proxy/"+
url;



},1200);



});





// Cursor subtle movement


const panel=document.querySelector(".panel");



document.addEventListener("mousemove",e=>{


let x=(e.clientX/innerWidth-.5)*5;

let y=(e.clientY/innerHeight-.5)*5;



panel.style.transform=

`rotateX(${-y}deg) rotateY(${x}deg)`;


});



</script>


</body>

</html>
