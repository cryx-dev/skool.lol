<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skool.LOL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

height:100vh;
overflow:hidden;

background:#000;

color:white;

display:flex;
justify-content:center;
align-items:center;

}



/* ==========================
   Loading Screen
========================== */


.loader{

position:fixed;
inset:0;

background:#000;

display:flex;
align-items:center;
justify-content:center;

z-index:100;

animation:hideLoader 1.8s forwards;

}


.loader-logo{

font-size:55px;
font-weight:900;

letter-spacing:-4px;

animation:pulse 1s infinite alternate;

}


.loader-logo span{

color:#2563eb;

}


@keyframes pulse{

from{
opacity:.5;
transform:scale(.95);
}

to{
opacity:1;
transform:scale(1);
}

}


@keyframes hideLoader{

0%,80%{
opacity:1;
}

100%{
opacity:0;
pointer-events:none;
}

}



/* ==========================
 Background
========================== */


canvas{

position:absolute;
inset:0;

opacity:.35;

}



.glow{

position:absolute;

width:700px;
height:700px;

background:#2563eb;

filter:blur(180px);

opacity:.12;

}



.glow.one{

top:-300px;
left:-250px;

}



.glow.two{

bottom:-350px;
right:-250px;

}



/* ==========================
 Card
========================== */


.wrapper{


perspective:1200px;

z-index:5;


}


.card{


width:820px;

max-width:92vw;


padding:65px;


position:relative;


background:

linear-gradient(
145deg,
rgba(255,255,255,.08),
rgba(255,255,255,.025)
);


border-radius:40px;


border:1px solid rgba(255,255,255,.12);


backdrop-filter:blur(35px);


box-shadow:

0 40px 120px rgba(0,0,0,.9);



transition:.15s;


overflow:hidden;


}



.card::before{

content:"";

position:absolute;

inset:-2px;


background:

linear-gradient(
120deg,
transparent,
#2563eb,
transparent
);


opacity:.25;

animation:borderMove 8s linear infinite;


}



.card>*{

position:relative;

z-index:2;

}



@keyframes borderMove{

0%{
transform:translateX(-50%);
}

100%{
transform:translateX(50%);
}

}



/* ==========================
 Logo
========================== */


.logo{


font-size:85px;

font-weight:900;

letter-spacing:-7px;


}


.logo span{

color:#2563eb;

text-shadow:

0 0 30px #2563eb;

}




.subtitle{


margin-top:15px;


font-size:20px;


color:#999;


}
    /* ==========================
 Divider
========================== */


.divider{

height:1px;

margin:45px 0;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.2),
transparent
);

}



/* ==========================
 Input Area
========================== */


form{

display:flex;

gap:15px;

}



.input-box{


height:70px;

flex:1;


display:flex;

align-items:center;


background:#050505;


border:

1px solid rgba(255,255,255,.12);


border-radius:22px;


transition:.3s;


}



.input-box:hover{

border-color:#2563eb;

box-shadow:

0 0 30px rgba(37,99,235,.15);

}



.icon{

font-size:22px;

margin-left:22px;

}



input{


width:100%;


height:100%;


padding:0 20px;


background:none;


border:none;


outline:none;


font-size:17px;


color:white;


}



input::placeholder{

color:#555;

}





/* ==========================
 Button
========================== */


button{


height:70px;


padding:0 40px;


border-radius:22px;


border:none;


background:white;


color:black;


font-size:17px;


font-weight:800;


cursor:pointer;


position:relative;


overflow:hidden;


transition:.35s;


}



button:hover{


transform:

translateY(-5px);


background:#2563eb;


color:white;


box-shadow:

0 20px 60px rgba(37,99,235,.5);


}



button::after{


content:"";


position:absolute;


top:0;


left:-120%;


height:100%;


width:80%;


background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.8),
transparent
);


transition:.6s;


}



button:hover::after{


left:150%;


}



/* ==========================
 Status
========================== */


.status{


display:flex;

justify-content:center;

gap:15px;

margin-top:40px;

flex-wrap:wrap;


}



.status div{


padding:12px 22px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.1);


border-radius:50px;


color:#aaa;


font-size:14px;


}



.status span{


color:white;

}



/* Footer */


.footer{


text-align:center;


margin-top:35px;


color:#555;


font-size:14px;


}



/* ==========================
 Mobile
========================== */


@media(max-width:700px){


.card{

padding:40px 25px;

}



.logo{

font-size:55px;

letter-spacing:-4px;

}



form{

flex-direction:column;

}



button{

width:100%;

}


}

</style>


</head>



<body>



<div class="loader">

<div class="loader-logo">

Skool<span>.LOL</span>

</div>

</div>



<canvas id="particles"></canvas>


<div class="glow one"></div>

<div class="glow two"></div>




<div class="wrapper">


<div class="card" id="card">



<div class="logo">

Skool<span>.LOL</span>

</div>


<div class="subtitle">

Fast. Private. Modern web access.

</div>



<div class="divider"></div>




<form id="unblocker-form">


<div class="input-box">


<div class="icon">
🌐
</div>


<input

id="url"

placeholder="Enter website URL..."

autocomplete="off"

>


</div>



<button>

Launch 🚀

</button>


</form>





<div class="status">


<div>
🟢 <span>Online</span>
</div>


<div>
⚡ <span>Fast</span>
</div>


<div>
🔒 <span>Secure</span>
</div>


</div>



<div class="footer">

Powered by Node.js • Skool.LOL

</div>



</div>


</div>





<script>


/* ==========================
 Proxy
========================== */


document
.getElementById("unblocker-form")
.addEventListener("submit",e=>{


e.preventDefault();


let url=document
.getElementById("url")
.value
.trim();



if(!url)return;



if(!url.startsWith("http"))

url="https://"+url;



window.location=

location.protocol+
"//"+
location.host+
"/proxy/"+
url;



});





/* ==========================
 3D Card Motion
========================== */


const card=document.getElementById("card");


document.addEventListener("mousemove",e=>{


let x=

(e.clientX/window.innerWidth-.5)*15;


let y=

(e.clientY/window.innerHeight-.5)*15;



card.style.transform=

`
rotateY(${x}deg)
rotateX(${-y}deg)
`;



});



document.addEventListener("mouseleave",()=>{

card.style.transform="";

});





/* ==========================
 Canvas Particles
========================== */


const canvas=document
.getElementById("particles");


const ctx=canvas.getContext("2d");



let particles=[];



function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}



resize();


window.onresize=resize;



for(let i=0;i<90;i++){


particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*2+1,

speed:Math.random()*.5+.1


});


}




function animate(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



particles.forEach(p=>{


p.y-=p.speed;


if(p.y<0)

p.y=canvas.height;



ctx.beginPath();


ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);


ctx.fillStyle=
"rgba(255,255,255,.25)";


ctx.fill();


});



requestAnimationFrame(animate);


}


animate();


</script>


</body>

</html>
